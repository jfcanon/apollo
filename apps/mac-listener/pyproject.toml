[project]
name = "jarvis-listener"
version = "0.1.0"
description = "Native macOS 'hey jarvis' wake-word listener for the Apollo desk agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "openwakeword>=0.6.0",
    "sounddevice>=0.4.6",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis-listener = "jarvis_listener.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis_listener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio: needs the openWakeWord/Silero ONNX models (skipped without them)",
]
